repos:
    # Built-in file checks (language-agnostic)
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: check-yaml
            name: Check YAML syntax
          - id: check-json
            name: Check JSON syntax
          - id: check-toml
            name: Check TOML syntax
          - id: check-merge-conflict
            name: Check for merge conflicts
          - id: check-case-conflict
            name: Check for case conflicts in filenames
          - id: detect-private-key
            name: Detect private keys

    # Prettier (formatting)
    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier
            name: Prettier format
            files: |
                (?x)^(
                  .*\.(ts|tsx|js|jsx|json|md|yaml|yml|toml)$
                )

    # ESLint (linting)
    # Disabled due to version incompatibility. Run manually: npm run lint
    # - repo: https://github.com/pre-commit/mirrors-eslint
    #   rev: v8.56.0
    #   hooks:
    #       - id: eslint
    #         name: ESLint
    #         files: \.(ts|tsx|js|jsx)$
    #         types: [file]

    # TypeScript type checking
    - repo: local
      hooks:
          - id: tsc-check
            name: TypeScript type check
            entry: bash -c 'npx tsc --noEmit'
            language: system
            pass_filenames: false
            stages: [pre-commit]

    # Custom build verification (cf:build but not deploy)
    # Disabled for now — too slow for pre-commit.
    # Uncomment to enable, or run manually: pre-commit run cf-build-check --all-files
    # - repo: local
    #   hooks:
    #       - id: cf-build-check
    #         name: Cloudflare build check
    #         entry: bash -c 'npm run cf:build'
    #         language: system
    #         pass_filenames: false
    #         stages: [pre-commit]
    #         # Only run if relevant files changed
    #         files: |
    #             (?x)^(
    #               prisma/|
    #               lib/|
    #               app/|
    #               components/|
    #               wrangler\.toml|
    #               package\.json|
    #               next\.config\.|
    #               tailwind\.config\.|
    #               tsconfig\.json
    #             )

    # Tests (optional - can be slow, uncomment if desired)
    # - repo: local
    #   hooks:
    #     - id: vitest-run
    #       name: Run tests
    #       entry: bash -c 'npm run test'
    #       language: system
    #       types: [typescript, javascript]
    #       pass_filenames: false
    #       stages: [commit]

    # Prisma schema validation
    - repo: local
      hooks:
          - id: prisma-format
            name: Prisma format
            entry: bash -c 'npx prisma format'
            language: system
            files: prisma/schema\.prisma$
            pass_filenames: false
            stages: [pre-commit]

# Global settings
default_stages: [pre-commit]
fail_fast: false
